; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test

[env:seeed_xiao_esp32s3]
build_flags = 
	-Os
	-D LV_CONF_INCLUDE_SIMPLE=1
	-DUSE_ARDUINO_GFX_LIBRARY=1
	-D LV_CONF_SUPPRESS_DEFINE_CHECK=1
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
build_src_filter = +<*> -<MinimalDisplayTest.cpp>
lib_deps = 
	me-no-dev/ESPAsyncWebServer
	me-no-dev/AsyncTCP
	mathertel/OneButton@^2.6.1
	mathertel/RotaryEncoder@^1.5.3
	adafruit/Adafruit GFX Library@^1.11.10
	adafruit/Adafruit NeoPixel@^1.12.3
	santerilindfors/WiFiProvisioner@^1.0.0
	https://github.com/pschatzmann/arduino-audio-tools.git
	bblanchon/ArduinoJson@^7.0.4
	bodmer/TFT_eSPI
	lvgl/lvgl
	lewisxhe/PCF8563_Library
	https://github.com/Seeed-Studio/Seeed_Arduino_RoundDisplay.git
upload_speed = 460800
upload_port = /dev/cu.usbmodem32301
board_build.flash_size = 16MB
board_build.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = firmware/partitions-16MB.csv
monitor_speed = 115200
