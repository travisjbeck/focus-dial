<!DOCTYPE html>
<html>
<head>
    <title>WebGL Animation Studio - Record & View</title>
    <style>
        body { 
            background: #0a0a0a; 
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #fff;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
        
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .mode-btn {
            background: #1a1a1a;
            color: #fff;
            border: 2px solid #333;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        
        .mode-btn.active {
            background: #2563eb;
            border-color: #3b82f6;
        }
        
        .content-area {
            display: none;
        }
        
        .content-area.active {
            display: block;
        }
        
        .canvas-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .canvas-wrapper {
            display: inline-block;
            position: relative;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: black;
        }
        
        canvas {
            display: block;
            width: 466px;
            height: 466px;
        }
        
        .canvas-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #888;
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .controls {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        select, input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            color: white;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 16px;
        }
        
        select {
            cursor: pointer;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        button:hover:not(:disabled) {
            background: #3b82f6;
            transform: translateY(-1px);
        }
        
        button:disabled {
            background: #333;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        button.secondary {
            background: #374151;
        }
        
        button.secondary:hover:not(:disabled) {
            background: #4b5563;
        }
        
        button.danger {
            background: #dc2626;
        }
        
        button.danger:hover:not(:disabled) {
            background: #ef4444;
        }
        
        #progress {
            width: 100%;
            height: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        #progressBar {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            width: 0%;
            transition: width 0.3s;
        }
        
        #status {
            text-align: center;
            padding: 20px;
            background: #0f0f0f;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 20px;
            border: 1px solid #222;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .info-item {
            background: #0f0f0f;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #222;
        }
        
        .info-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .info-value {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
        }
        
        .file-list {
            max-height: 200px;
            overflow-y: auto;
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 10px;
            margin-top: 20px;
        }
        
        .file-item {
            padding: 8px 12px;
            margin: 4px 0;
            background: #1a1a1a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-item:hover {
            background: #2a2a2a;
        }
        
        .file-item.selected {
            background: #2563eb;
        }
        
        .file-size {
            color: #666;
            font-size: 12px;
        }
        
        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebGL Animation Studio</h1>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('record')">Record Animation</button>
            <button class="mode-btn" onclick="switchMode('view')">View Recording</button>
        </div>
        
        <!-- RECORDING MODE -->
        <div id="recordMode" class="content-area active">
            <div class="canvas-section">
                <div class="canvas-wrapper">
                    <canvas id="recordCanvas" width="233" height="233"></canvas>
                    <div class="canvas-label">Recording at 233×233 (Half Resolution)</div>
                </div>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Animation Type</label>
                    <select id="animationType" onchange="updateColorSchemes()">
                        <option value="nebula">Nebula</option>
                        <option value="aurora">Aurora Borealis</option>
                        <option value="void">Void</option>
                        <option value="dmt">DMT</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>Color Scheme</label>
                    <select id="colorScheme" onchange="initializeShader()"></select>
                </div>
                
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Duration</div>
                        <input type="number" id="duration" value="20" min="5" max="60">
                    </div>
                    <div class="info-item">
                        <div class="info-label">Framerate</div>
                        <input type="number" id="fps" value="30" min="10" max="60">
                    </div>
                    <div class="info-item">
                        <div class="info-label">Loop Transition</div>
                        <input type="number" id="transitionDuration" value="2" min="0.5" max="5" step="0.5">
                    </div>
                </div>
                
                <div id="progress">
                    <div id="progressBar"></div>
                </div>
                
                <div class="button-group">
                    <button id="startBtn" onclick="startRecording()">Start Recording</button>
                    <button id="stopBtn" onclick="stopRecording()" disabled>Stop Recording</button>
                    <button id="downloadBtn" onclick="downloadRecording()" disabled>Download Video</button>
                </div>
            </div>
            
            <div id="recordStatus">Ready to record...</div>
        </div>
        
        <!-- VIEWING MODE -->
        <div id="viewMode" class="content-area">
            <div class="canvas-section">
                <div class="canvas-wrapper">
                    <canvas id="viewCanvas" width="466" height="466"></canvas>
                    <div class="canvas-label">Playback at Full Resolution</div>
                </div>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Select Recording</label>
                    <input type="file" id="fileInput" accept=".bin,.webgl" onchange="loadRecording(event)">
                </div>
                
                <div id="videoInfo" style="display: none;">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Dimensions</div>
                            <div class="info-value" id="dimensions">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">FPS</div>
                            <div class="info-value" id="vfps">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Frames</div>
                            <div class="info-value" id="frameCount">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Duration</div>
                            <div class="info-value" id="vduration">-</div>
                        </div>
                    </div>
                </div>
                
                <div id="viewProgress">
                    <div id="viewProgressBar"></div>
                </div>
                
                <div class="button-group">
                    <button id="playBtn" onclick="playVideo()" disabled>Play</button>
                    <button id="pauseBtn" onclick="pauseVideo()" disabled>Pause</button>
                    <button id="stopBtn2" onclick="stopVideo()" disabled>Stop</button>
                    <label style="margin-left: 20px; display: flex; align-items: center;">
                        <input type="checkbox" id="loopCheckbox" checked style="width: auto; margin-right: 8px;"> Loop
                    </label>
                </div>
            </div>
            
            <div id="viewStatus">No file loaded</div>
            
            <div id="savedRecordings" style="margin-top: 30px; display: none;">
                <h3 style="color: #888; font-weight: 300;">Recent Recordings</h3>
                <div class="file-list" id="fileList"></div>
            </div>
        </div>
    </div>

    <!-- Load shader scripts -->
    <script src="js/nebula-shader.js"></script>
    <script src="js/aurora-shader.js"></script>
    <script src="js/void-shader.js"></script>
    <script src="js/dmt-shader.js"></script>
    
    <script>
        // Global variables
        let currentMode = 'record';
        let currentShader = null;
        let recording = false;
        let frames = [];
        let frameCount = 0;
        let recordingStartTime = 0;
        
        // Viewer variables
        let videoData = null;
        let viewFrames = [];
        let currentFrame = 0;
        let playing = false;
        let animationId = null;
        let lastFrameTime = 0;
        
        // Saved recordings
        let savedRecordings = [];
        
        // Color schemes for each animation type
        const colorSchemes = {
            nebula: ['cosmic-rainbow', 'deep-abyss', 'dusk', 'mist'],
            aurora: ['cosmic-rainbow', 'deep-abyss', 'dusk', 'mist'],
            void: ['cosmic-rainbow', 'deep-abyss', 'dusk', 'mist'],
            dmt: ['cosmic-rainbow', 'deep-abyss', 'dusk', 'mist']
        };
        
        // Mode switching
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-area').forEach(area => area.classList.remove('active'));
            
            if (mode === 'record') {
                document.querySelector('.mode-btn:nth-child(1)').classList.add('active');
                document.getElementById('recordMode').classList.add('active');
                initializeShader();
            } else {
                document.querySelector('.mode-btn:nth-child(2)').classList.add('active');
                document.getElementById('viewMode').classList.add('active');
                updateFileList();
            }
        }
        
        // Update color schemes based on animation type
        function updateColorSchemes() {
            const type = document.getElementById('animationType').value;
            const schemeSelect = document.getElementById('colorScheme');
            schemeSelect.innerHTML = '';
            
            colorSchemes[type].forEach((scheme, index) => {
                const option = document.createElement('option');
                option.value = scheme;
                option.textContent = scheme.split('-').map(word => 
                    word.charAt(0).toUpperCase() + word.slice(1)
                ).join(' ');
                if (index === 0) option.selected = true; // Select first option (cosmic-rainbow)
                schemeSelect.appendChild(option);
            });
            
            initializeShader();
        }
        
        // Initialize shader based on current selection
        async function initializeShader() {
            const canvas = document.getElementById('recordCanvas');
            const type = document.getElementById('animationType').value;
            const scheme = document.getElementById('colorScheme').value;
            
            // Stop current shader if exists
            if (currentShader) {
                currentShader.stop();
                currentShader = null;
            }
            
            // Clear any existing WebGL context
            const existingContext = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (existingContext) {
                existingContext.getExtension('WEBGL_lose_context')?.loseContext();
            }
            
            // Create new canvas to ensure fresh context
            const newCanvas = document.createElement('canvas');
            newCanvas.id = 'recordCanvas';
            newCanvas.width = 233;
            newCanvas.height = 233;
            newCanvas.style.background = 'black'; // Ensure black background
            canvas.parentNode.replaceChild(newCanvas, canvas);
            
            // Override canvas getContext to ensure proper settings
            const originalGetContext = newCanvas.getContext.bind(newCanvas);
            newCanvas.getContext = function(contextType, attributes) {
                if (contextType === 'webgl' || contextType === 'experimental-webgl' || contextType === 'webgl2') {
                    attributes = attributes || {};
                    attributes.preserveDrawingBuffer = true;
                    attributes.alpha = true;
                    attributes.depth = false;
                    attributes.stencil = false;
                    attributes.antialias = true;
                    attributes.premultipliedAlpha = false;
                }
                return originalGetContext(contextType, attributes);
            };
            
            // Create appropriate shader
            let ShaderClass;
            switch(type) {
                case 'nebula':
                    ShaderClass = NebulaShader;
                    break;
                case 'aurora':
                    ShaderClass = AuroraShader;
                    break;
                case 'void':
                    ShaderClass = VoidShader;
                    break;
                case 'dmt':
                    ShaderClass = DMTShader;
                    break;
            }
            
            currentShader = new ShaderClass('recordCanvas', scheme);
            currentShader.canvas = newCanvas;
            
            const success = await currentShader.init();
            if (success) {
                currentShader.start();
                document.getElementById('recordStatus').textContent = `${type} shader initialized`;
            } else {
                document.getElementById('recordStatus').textContent = 'Shader initialization failed';
            }
        }
        
        // Convert canvas to RGBA data
        function canvasToRGBA() {
            if (!currentShader || !currentShader.gl) {
                console.error('No shader or WebGL context');
                return null;
            }
            
            const gl = currentShader.gl;
            gl.finish();
            
            const width = 233;
            const height = 233;
            const pixels = new Uint8Array(width * height * 4);
            gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            
            // Flip vertically
            const flipped = new Uint8Array(width * height * 4);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const srcIdx = ((height - 1 - y) * width + x) * 4;
                    const dstIdx = (y * width + x) * 4;
                    flipped[dstIdx] = pixels[srcIdx];
                    flipped[dstIdx + 1] = pixels[srcIdx + 1];
                    flipped[dstIdx + 2] = pixels[srcIdx + 2];
                    flipped[dstIdx + 3] = pixels[srcIdx + 3];
                }
            }
            
            return flipped;
        }
        
        // Start recording
        function startRecording() {
            const duration = parseFloat(document.getElementById('duration').value) * 1000;
            const fps = parseInt(document.getElementById('fps').value);
            const transitionDuration = parseFloat(document.getElementById('transitionDuration').value) * 1000;
            const frameInterval = 1000 / fps;
            
            recording = true;
            frames = [];
            frameCount = 0;
            recordingStartTime = Date.now();
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('downloadBtn').disabled = true;
            
            // Record extra frames at the beginning for seamless looping
            const transitionFrames = Math.floor(transitionDuration * fps / 1000);
            const mainFrames = Math.floor(duration * fps / 1000);
            const totalFramesToRecord = mainFrames + transitionFrames;
            
            let extraFrames = []; // Store the extra frames recorded at the beginning
            
            const recordFrame = () => {
                if (!recording || frameCount >= totalFramesToRecord) {
                    // Remove the extra frames from the beginning and create final loop
                    if (extraFrames.length > 0) {
                        frames = frames.slice(transitionFrames); // Remove extra frames from start
                        
                        // Now blend the end frames with the extra frames we saved
                        const startBlendIndex = frames.length - transitionFrames;
                        for (let i = 0; i < transitionFrames; i++) {
                            const blendFactor = i / transitionFrames;
                            const currentFrame = frames[startBlendIndex + i];
                            const targetFrame = extraFrames[i];
                            
                            // Blend current frame with corresponding extra frame
                            for (let j = 0; j < currentFrame.length; j += 4) {
                                currentFrame[j] = Math.round(currentFrame[j] * (1 - blendFactor) + targetFrame[j] * blendFactor);
                                currentFrame[j + 1] = Math.round(currentFrame[j + 1] * (1 - blendFactor) + targetFrame[j + 1] * blendFactor);
                                currentFrame[j + 2] = Math.round(currentFrame[j + 2] * (1 - blendFactor) + targetFrame[j + 2] * blendFactor);
                                currentFrame[j + 3] = Math.round(currentFrame[j + 3] * (1 - blendFactor) + targetFrame[j + 3] * blendFactor);
                            }
                        }
                    }
                    stopRecording();
                    return;
                }
                
                const frameData = canvasToRGBA();
                frames.push(frameData);
                
                // Save the extra frames at the beginning
                if (frameCount < transitionFrames) {
                    extraFrames.push(new Uint8Array(frameData));
                }
                
                frameCount++;
                
                const progress = (frameCount / totalFramesToRecord) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('recordStatus').textContent = `Recording... Frame ${frameCount}/${totalFramesToRecord}`;
                
                setTimeout(recordFrame, frameInterval);
            };
            
            recordFrame();
        }
        
        // Stop recording
        function stopRecording() {
            recording = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('recordStatus').textContent = `Recording complete! ${frames.length} frames captured.`;
            document.getElementById('progressBar').style.width = '100%';
        }
        
        // Download recording
        function downloadRecording() {
            if (frames.length === 0) return;
            
            const type = document.getElementById('animationType').value;
            const scheme = document.getElementById('colorScheme').value;
            const fps = parseInt(document.getElementById('fps').value);
            const width = 233;
            const height = 233;
            const frameCount = frames.length;
            
            // ESP32 format: 8-byte header + RGB888 data
            const headerSize = 8;
            const frameSize = width * height * 3; // RGB888
            const totalSize = headerSize + (frameSize * frameCount);
            
            const buffer = new ArrayBuffer(totalSize);
            const view = new DataView(buffer);
            
            // Write simple header (no magic number)
            view.setUint16(0, width, true);
            view.setUint16(2, height, true);
            view.setUint16(4, fps, true);
            view.setUint16(6, frameCount, true);
            
            // Convert RGBA to RGB888 and write frames
            let offset = headerSize;
            for (const frame of frames) {
                for (let i = 0; i < frame.length; i += 4) {
                    // Apply alpha blending with black background
                    const alpha = frame[i + 3] / 255.0;
                    view.setUint8(offset++, Math.round(frame[i] * alpha));     // R * alpha
                    view.setUint8(offset++, Math.round(frame[i + 1] * alpha)); // G * alpha
                    view.setUint8(offset++, Math.round(frame[i + 2] * alpha)); // B * alpha
                }
            }
            
            // Create download
            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const filename = `${type}-${scheme}.bin`;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            
            document.getElementById('recordStatus').textContent = `Downloaded: ${filename}`;
        }
        
        // Load recording for viewing
        async function loadRecording(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('viewStatus').textContent = 'Loading file...';
            
            try {
                const buffer = await file.arrayBuffer();
                const view = new DataView(buffer);
                
                // Check if it's ESP32 format or WebGL format
                const magic = view.getUint32(0, false);
                const isWebGLFormat = (magic === 0x5745424C); // 'WEBL'
                
                let width, height, fps, frameCount, type, scheme;
                let headerSize, frameSize, pixelFormat;
                
                if (isWebGLFormat) {
                    // WebGL format with 32-byte header and RGBA data
                    width = view.getUint16(4, true);
                    height = view.getUint16(6, true);
                    fps = view.getUint16(8, true);
                    frameCount = view.getUint16(10, true);
                    
                    // Read type and scheme
                    const decoder = new TextDecoder();
                    const typeBytes = new Uint8Array(buffer, 12, 8);
                    const schemeBytes = new Uint8Array(buffer, 20, 8);
                    type = decoder.decode(typeBytes).replace(/\0/g, '');
                    scheme = decoder.decode(schemeBytes).replace(/\0/g, '');
                    
                    headerSize = 32;
                    frameSize = width * height * 4; // RGBA
                    pixelFormat = 'RGBA';
                } else {
                    // ESP32 format with 8-byte header and RGB888 data
                    width = view.getUint16(0, true);
                    height = view.getUint16(2, true);
                    fps = view.getUint16(4, true);
                    frameCount = view.getUint16(6, true);
                    
                    // Extract type and scheme from filename
                    const nameParts = file.name.replace('.bin', '').split('-');
                    type = nameParts[0] || 'unknown';
                    scheme = nameParts[1] || 'unknown';
                    
                    headerSize = 8;
                    frameSize = width * height * 3; // RGB888
                    pixelFormat = 'RGB';
                }
                
                // Display info
                document.getElementById('videoInfo').style.display = 'block';
                document.getElementById('dimensions').textContent = `${width}×${height}`;
                document.getElementById('vfps').textContent = fps;
                document.getElementById('frameCount').textContent = frameCount;
                document.getElementById('vduration').textContent = `${(frameCount / fps).toFixed(1)}s`;
                
                // Store video data
                videoData = {
                    width: width,
                    height: height,
                    fps: fps,
                    frameCount: frameCount,
                    frameSize: width * height * 4, // Always use RGBA for display
                    frameDuration: 1000 / fps,
                    type: type,
                    scheme: scheme
                };
                
                // Load frames
                viewFrames = [];
                let offset = headerSize;
                
                for (let i = 0; i < frameCount; i++) {
                    const frameData = new Uint8Array(width * height * 4);
                    
                    if (pixelFormat === 'RGBA') {
                        // WebGL format - direct copy
                        for (let j = 0; j < frameData.length; j++) {
                            frameData[j] = view.getUint8(offset + j);
                        }
                        offset += frameSize;
                    } else {
                        // ESP32 format - convert RGB888 to RGBA
                        let rgbIndex = 0;
                        for (let j = 0; j < frameData.length; j += 4) {
                            frameData[j] = view.getUint8(offset + rgbIndex);     // R
                            frameData[j + 1] = view.getUint8(offset + rgbIndex + 1); // G
                            frameData[j + 2] = view.getUint8(offset + rgbIndex + 2); // B
                            frameData[j + 3] = 255; // A (fully opaque)
                            rgbIndex += 3;
                        }
                        offset += frameSize;
                    }
                    
                    viewFrames.push(frameData);
                    
                    if (i % 10 === 0) {
                        document.getElementById('viewProgressBar').style.width = `${(i / frameCount) * 100}%`;
                    }
                }
                
                document.getElementById('viewProgressBar').style.width = '0%';
                document.getElementById('viewStatus').textContent = `Loaded: ${type} - ${scheme} (${frameCount} frames, ${pixelFormat})`;
                
                // Enable controls
                document.getElementById('playBtn').disabled = false;
                document.getElementById('stopBtn2').disabled = false;
                
                // Draw first frame
                currentFrame = 0;
                drawFrame(0);
                
            } catch (error) {
                document.getElementById('viewStatus').textContent = `Error: ${error.message}`;
            }
        }
        
        // Draw frame to viewer canvas
        function drawFrame(frameIndex) {
            if (!viewFrames[frameIndex]) return;
            
            const canvas = document.getElementById('viewCanvas');
            const ctx = canvas.getContext('2d');
            const frame = viewFrames[frameIndex];
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Create scaled image data
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = videoData.width;
            tempCanvas.height = videoData.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            const imageData = tempCtx.createImageData(videoData.width, videoData.height);
            for (let i = 0; i < frame.length; i++) {
                imageData.data[i] = frame[i];
            }
            
            tempCtx.putImageData(imageData, 0, 0);
            
            // Scale up to display size
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(tempCanvas, 0, 0, 466, 466);
            
            // Update progress
            document.getElementById('viewProgressBar').style.width = 
                `${(frameIndex / Math.max(1, videoData.frameCount - 1)) * 100}%`;
        }
        
        // Animation loop for playback
        function animate(timestamp) {
            if (!playing) return;
            
            const elapsed = timestamp - lastFrameTime;
            
            if (elapsed >= videoData.frameDuration) {
                currentFrame++;
                
                if (currentFrame >= videoData.frameCount) {
                    if (document.getElementById('loopCheckbox').checked) {
                        currentFrame = 0;
                    } else {
                        stopVideo();
                        return;
                    }
                }
                
                drawFrame(currentFrame);
                lastFrameTime = timestamp;
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Playback controls
        function playVideo() {
            if (playing || !videoData) return;
            playing = true;
            lastFrameTime = performance.now();
            animate(lastFrameTime);
            
            document.getElementById('playBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('viewStatus').textContent = 'Playing...';
        }
        
        function pauseVideo() {
            playing = false;
            if (animationId) cancelAnimationFrame(animationId);
            
            document.getElementById('playBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('viewStatus').textContent = 'Paused';
        }
        
        function stopVideo() {
            pauseVideo();
            currentFrame = 0;
            if (viewFrames.length > 0) drawFrame(0);
            document.getElementById('viewProgressBar').style.width = '0%';
            document.getElementById('viewStatus').textContent = 'Stopped';
        }
        
        // Update file list
        function updateFileList() {
            if (savedRecordings.length > 0) {
                document.getElementById('savedRecordings').style.display = 'block';
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';
                
                savedRecordings.forEach(rec => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <span>${rec.name}</span>
                        <span class="file-size">${(rec.size / 1024 / 1024).toFixed(2)} MB</span>
                    `;
                    fileList.appendChild(item);
                });
            }
        }
        
        // Initialize on load
        window.addEventListener('load', () => {
            updateColorSchemes();
            initializeShader();
        });
    </script>
</body>
</html>
